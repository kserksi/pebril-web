name: Site checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static and pure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.169.0
      HUGO_SHA256: 2d2f0bfe357d8cb4cec02f6bb28a3bff34978c8dda44b618029c5eb9d66765a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Static checks
        run: python3 scripts/check-site.py

      - name: Journal is up to date
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          mkdir -p /tmp/hugo
          tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo hugo
          /tmp/hugo/hugo --source journal-src --cleanDestinationDir
          git diff --exit-code -- journal

      - name: Pure test suite
        run: |
          node --test \
            qa/tests/geometry.test.mjs \
            qa/tests/gathering.test.mjs \
            qa/tests/local-photos.test.mjs \
            qa/tests/photo-pool.test.mjs
